<!DOCTYPE html>
<html><head><style>
html,body{margin:0;padding:0;}
.banner{
  width:1024px;height:500px;
  background:linear-gradient(135deg,#0f766e 0%,#115e59 100%);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  font-family:Georgia, 'Times New Roman', serif;
}
.circle{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.05);
}
.c1{ width:600px; height:600px; right:-180px; top:-220px; }
.c2{ width:420px; height:420px; right:-100px; bottom:-180px; }
.content{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:48px;
  padding-left:80px;
}
.icon{
  width:200px;height:200px;flex-shrink:0;
}
.text h1{
  margin:0;
  font-size:108px;
  color:#ffffff;
  font-weight:700;
  letter-spacing:1px;
}
.text p{
  margin:14px 0 0;
  font-family:'Segoe UI', Arial, sans-serif;
  font-size:34px;
  color:rgba(255,255,255,0.82);
  font-weight:400;
}
</style></head><body>
<div class="banner">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="content">
    <svg class="icon" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" fill="none">
      <g transform="translate(54,54) scale(1.096) translate(-50,-47.5)">
        <circle cx="50" cy="20" r="10" stroke="white" stroke-width="8"/>
        <line x1="50" y1="30" x2="50" y2="76" stroke="white" stroke-width="8" stroke-linecap="round"/>
        <line x1="30" y1="40" x2="70" y2="40" stroke="white" stroke-width="8" stroke-linecap="round"/>
        <path d="M22 56 A28 28 0 0 0 50 84 A28 28 0 0 0 78 56" stroke="white" stroke-width="8" stroke-linecap="round"/>
        <path d="M22 56 L31 49" stroke="white" stroke-width="8" stroke-linecap="round"/>
        <path d="M78 56 L69 49" stroke="white" stroke-width="8" stroke-linecap="round"/>
      </g>
    </svg>
    <div class="text">
      <h1>Anchor</h1>
      <p>Your private recovery companion</p>
    </div>
  </div>
</div>
</body></html>
